name: Publish UHV Sentinel release
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_release.py
      - name: Publish the release matching version.py
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v$(python -c 'from version import __version__; print(__version__)')"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "Ref $GITHUB_REF_NAME does not match $TAG" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Refreshing existing release assets after a CI fix."
            gh release upload "$TAG" dist/uhv-sentinel-release.zip dist/uhv-sentinel-server-release.zip dist/SHA256SUMS.txt --clobber
            exit 0
          fi
          gh release create "$TAG" \
            dist/uhv-sentinel-release.zip dist/uhv-sentinel-server-release.zip dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "UHV Sentinel $TAG" \
            --notes "v0.0.7: Ubuntu Server and Docker maintenance center with authenticated check/install, stage progress, live logs, package-removal safeguards, image refresh, and separately confirmed reboot. Data and profiles are preserved. Physical Ubuntu Server validation is still required."
